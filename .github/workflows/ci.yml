name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Evita que corridas viejas de un mismo PR sigan consumiendo minutos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: patitas
          POSTGRES_PASSWORD: patitas_ci_only
          POSTGRES_DB: patitas_en_alerta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U patitas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://patitas:patitas_ci_only@localhost:5432/patitas_en_alerta_test
      DIRECT_URL: postgresql://patitas:patitas_ci_only@localhost:5432/patitas_en_alerta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Ejecutar pirámide de tests con cobertura mínima (80%)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Verificar que el proyecto compila para producción
        run: npm run build
        env:
          # Placeholders solo para que el build no falle por variables faltantes;
          # nunca usar estos valores en un despliegue real.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          DATABASE_URL: postgresql://patitas:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: placeholder
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: placeholder
