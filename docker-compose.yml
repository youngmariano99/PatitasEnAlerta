version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # Imagen con pgvector preinstalado, para desarrollo local sin depender de Supabase cloud.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: patitas
      POSTGRES_PASSWORD: patitas_dev_only
      POSTGRES_DB: patitas_en_alerta
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patitas -d patitas_en_alerta']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
